<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chess matchmaking</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #f2b544; --ok: #4cd97b; --warn: #f0a04b; --bad: #ef6b6b; --info: #6ea8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(1200px 700px at 50% -250px, #1b2030 0%, var(--bg) 60%); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }

  /* top bar */
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
           padding: .9rem 1.25rem; font-size: .9rem; color: var(--muted); z-index: 2; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--text); }
  header h1 span { color: var(--accent); }
  .conn { display: flex; align-items: center; gap: .5rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px rgba(239,107,107,.15); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(76,217,123,.15); }

  /* screens */
  .screen { display: none; min-height: 100%; align-items: center; justify-content: center; padding: 5rem 1.25rem 6rem; }
  .screen.show { display: flex; }
  .center { text-align: center; width: 100%; max-width: 520px; animation: pop .2s ease-out; }
  @keyframes pop { from { transform: scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.6rem 1.7rem; text-align: left; }
  .card h2 { margin: 0 0 1rem; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  input { flex: 1; min-width: 180px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
          padding: .75rem .9rem; font-size: 1.05rem; outline: none; }
  input:focus { border-color: var(--accent); }
  button { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: .7rem 1.1rem;
           font-size: 1rem; cursor: pointer; transition: background .12s, border-color .12s, transform .05s; }
  button:hover:not(:disabled) { background: #262b36; border-color: #3a4150; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1300; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #ffc65a; border-color: #ffc65a; }
  button.good { background: var(--ok); border-color: var(--ok); color: #05210f; font-weight: 600; }
  button.good:hover:not(:disabled) { background: #63e58f; }
  button.danger { border-color: rgba(239,107,107,.5); color: var(--bad); }
  button.danger:hover:not(:disabled) { background: rgba(239,107,107,.12); }
  button.big { font-size: 1.35rem; padding: 1.1rem 2.6rem; border-radius: 14px; box-shadow: 0 10px 30px rgba(242,181,68,.18); }

  /* idle / waiting */
  .eyebrow { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .15em; margin-bottom: 1rem; }
  .bigtimer { font-size: clamp(4rem, 16vw, 8rem); font-weight: 700; letter-spacing: .02em; line-height: 1; font-variant-numeric: tabular-nums;
              color: var(--text); text-shadow: 0 0 40px rgba(242,181,68,.15); margin: .5rem 0 1rem; }
  .sub { color: var(--muted); }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: .5rem; animation: pulse 1.4s infinite; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8);} 50% { opacity: 1; transform: scale(1.15);} }

  /* match */
  .match { border-color: rgba(242,181,68,.45); background: linear-gradient(180deg, rgba(242,181,68,.07), transparent 60%), var(--panel); }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; margin: .25rem 0 1.2rem; }
  .player { text-align: center; }
  .player .name { font-size: 1.25rem; font-weight: 600; word-break: break-all; }
  .player .rating { color: var(--muted); font-size: .9rem; }
  .vs .x { color: var(--accent); font-weight: 700; letter-spacing: .1em; }
  .countdown { text-align: center; font-size: 3.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; margin: .2rem 0 .6rem; }
  .countdown.urgent { color: var(--bad); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 0 0 1.2rem; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width .25s linear; }
  .bar.urgent i { background: var(--bad); }
  .actions { display: flex; gap: .6rem; }
  .actions button { flex: 1; padding: .85rem; font-size: 1.05rem; }
  .hint { color: var(--muted); font-size: .88rem; margin-top: .8rem; text-align: center; min-height: 1.3em; }
  .playing { border-color: rgba(76,217,123,.45); }

  /* bottom-right control */
  #corner { position: fixed; right: 1.25rem; bottom: 1.25rem; display: flex; gap: .5rem; z-index: 2; }
  #corner button { box-shadow: 0 8px 24px rgba(0,0,0,.35); }

  /* toasts */
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); top: 3.6rem; display: flex; flex-direction: column; gap: .5rem; z-index: 9; align-items: center; }
  .toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--info); border-radius: 10px;
           padding: .7rem .9rem; font-size: .9rem; max-width: 420px; animation: rise .2s ease-out; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); }
  @keyframes rise { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* log */
  #logwrap { position: fixed; left: 1.25rem; bottom: 1.25rem; z-index: 2; max-width: min(520px, calc(100vw - 12rem)); }
  #logwrap summary { cursor: pointer; color: var(--muted); font-size: .8rem; user-select: none; }
  #log { margin-top: .5rem; background: #0b0d11; border: 1px solid var(--line); border-radius: 10px; padding: .6rem; height: 200px; width: 520px; max-width: 100%;
         overflow-y: auto; font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; color: #b9c0d0; }
  #log .in { color: #8ee0a5; } #log .out { color: #8fbaff; } #log .err { color: #ff9a9a; } #log .t { color: #5c6577; }
  @media (max-width: 600px) { .vs { grid-template-columns: 1fr; } .vs .x { display: none; } #logwrap { display: none; } }
</style>
</head>
<body>
<header>
  <h1>♞ chess <span>matchmaking</span></h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText">disconnected</span></div>
</header>

<!-- 1. connect -->
<section class="screen show" id="s-connect">
  <div class="center">
    <div class="card">
      <h2>Who are you?</h2>
      <div class="row">
        <input id="playerId" placeholder="player id" autocomplete="off" autofocus>
        <button class="primary" id="connect">Connect</button>
      </div>
    </div>
  </div>
</section>

<!-- 2. idle -->
<section class="screen" id="s-idle">
  <div class="center">
    <div class="eyebrow">ready</div>
    <button class="primary big" id="join">Enter lobby</button>
    <p class="sub" style="margin-top:1.2rem">You'll be paired with someone close to your rating.</p>
  </div>
</section>

<!-- 3. waiting -->
<section class="screen" id="s-waiting">
  <div class="center">
    <div class="eyebrow"><span class="pulse"></span>looking for an opponent</div>
    <div class="bigtimer" id="waitTimer">00:00</div>
    <p class="sub">The longer you wait, the wider the rating range we search.</p>
  </div>
</section>

<!-- 4. match proposed -->
<section class="screen" id="s-match">
  <div class="center">
    <div class="card match">
      <h2>Match found</h2>
      <div class="vs">
        <div class="player"><div class="name" id="meName">you</div><div class="rating">&nbsp;</div></div>
        <div class="x">VS</div>
        <div class="player"><div class="name" id="oppName">?</div><div class="rating" id="oppRating"></div></div>
      </div>
      <div class="countdown" id="countdown">15</div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="actions">
        <button class="good" id="accept">Accept</button>
        <button class="danger" id="decline">Decline</button>
      </div>
      <div class="hint" id="matchHint"></div>
    </div>
  </div>
</section>

<!-- 5. playing -->
<section class="screen" id="s-playing">
  <div class="center">
    <div class="card playing">
      <h2>Now playing</h2>
      <div class="vs">
        <div class="player"><div class="name" id="meName2">you</div><div class="rating">&nbsp;</div></div>
        <div class="x">VS</div>
        <div class="player"><div class="name" id="oppName2">?</div><div class="rating" id="oppRating2"></div></div>
      </div>
      <div class="hint">match <code id="matchIdText"></code> — the board would go here</div>
    </div>
  </div>
</section>

<div id="corner">
  <button class="danger" id="leave" hidden>Leave lobby</button>
  <button id="disconnect" hidden>Disconnect</button>
</div>

<details id="logwrap">
  <summary>protocol log</summary>
  <div id="log"></div>
</details>
<div id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
let ws = null, me = null, state = null, currentMatch = null, joinedAt = null, deadline = null, total = 15;

const now = () => Date.now();
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`; };
function log(cls, text) {
  const l = $('log');
  l.insertAdjacentHTML('beforeend', `<span class="t">${new Date().toLocaleTimeString()}</span> <span class="${cls}">${text.replace(/</g,'&lt;')}</span>\n`);
  l.scrollTop = l.scrollHeight;
}
function toast(cls, text, ms = 3500) {
  const el = document.createElement('div'); el.className = `toast ${cls}`; el.textContent = text;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), ms);
}
function send(cmd) { if (!ws || ws.readyState !== 1) return; ws.send(JSON.stringify(cmd)); log('out', '→ ' + JSON.stringify(cmd)); }

// ---------- screens ----------
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id)); }
function render() {
  if (!ws) { show('s-connect'); $('leave').hidden = true; $('disconnect').hidden = true; return; }
  $('disconnect').hidden = false;
  $('leave').hidden = state !== 'WAITING';
  switch (state) {
    case 'WAITING': show('s-waiting'); break;
    case 'PENDING': show('s-match'); break;
    case 'IN_MATCH': show('s-playing'); break;
    default: show('s-idle');
  }
}
function setState(next, matchId) {
  state = next || null;
  if (state === 'WAITING') { if (!joinedAt) joinedAt = now(); } else joinedAt = null;
  if (state !== 'PENDING') { currentMatch = null; deadline = null; }
  if (state === 'IN_MATCH' && matchId) $('matchIdText').textContent = matchId;
  render();
}
function showMatch(m) {
  currentMatch = m.matchId; total = m.expiresInSeconds; deadline = now() + total * 1000;
  $('meName').textContent = me; $('oppName').textContent = m.opponent.id; $('oppRating').textContent = `rating ${m.opponent.rating}`;
  $('accept').disabled = false; $('decline').disabled = false; $('matchHint').textContent = 'Accept to start the game';
  $('countdown').classList.remove('urgent'); $('bar').classList.remove('urgent'); $('barFill').style.width = '100%';
  setState('PENDING');
}
function showPlaying(m) {
  $('meName2').textContent = me; $('oppName2').textContent = m.opponent.id; $('oppRating2').textContent = `rating ${m.opponent.rating}`;
  setState('IN_MATCH', m.matchId);
}
function setConnected(on) {
  $('dot').classList.toggle('on', on); $('connText').textContent = on ? me : 'disconnected';
  if (!on) { state = null; joinedAt = null; deadline = null; }
  render();
}
function tick() {
  if (joinedAt) $('waitTimer').textContent = fmt(now() - joinedAt);
  if (deadline) {
    const left = Math.max(0, deadline - now());
    $('countdown').textContent = Math.ceil(left / 1000);
    $('barFill').style.width = (100 * left / (total * 1000)) + '%';
    const urgent = left < 5000; $('countdown').classList.toggle('urgent', urgent); $('bar').classList.toggle('urgent', urgent);
    if (left === 0) { $('accept').disabled = true; $('decline').disabled = true; $('matchHint').textContent = 'Expired — waiting for the server…'; }
  }
}

// ---------- socket ----------
$('connect').onclick = () => {
  const id = $('playerId').value.trim();
  if (!id) { $('playerId').focus(); return toast('warn', 'Enter a player id first'); }
  me = id; localStorage.setItem('playerId', id);
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?playerId=${encodeURIComponent(id)}`);
  ws.onopen = () => { setConnected(true); log('in', `connected as ${id}`); };
  ws.onclose = e => { ws = null; setConnected(false); log('err', `closed: ${e.reason || e.code}`); if (e.reason) toast('bad', e.reason); };
  ws.onerror = () => log('err', 'socket error');
  ws.onmessage = e => {
    const m = JSON.parse(e.data); log('in', '← ' + e.data);
    switch (m.type) {
      case 'STATUS':
        // a STATUS never downgrades a PENDING we are already showing (the push carries more detail than the status)
        if (!(m.state === 'PENDING' && state === 'PENDING')) setState(m.state, m.matchId);
        break;
      case 'MATCH_PROPOSED': showMatch(m); toast('ok', `Match found vs ${m.opponent.id} (${m.opponent.rating})`); break;
      case 'MATCH_STARTED': showPlaying(m); toast('ok', `Game on vs ${m.opponent.id}!`); break;
      case 'MATCH_CANCELLED': {
        const why = { DECLINED: 'declined', TIMEOUT: 'timed out', PARTNER_UNAVAILABLE: 'opponent unavailable' }[m.reason] || m.reason;
        setState(m.backInLobby ? 'WAITING' : null);
        toast(m.backInLobby ? 'warn' : 'bad', m.backInLobby ? `Match ${why} — still looking` : `Match ${why}`); break;
      }
      case 'ERROR': toast('bad', m.message); break;
    }
  };
};
$('disconnect').onclick = () => ws && ws.close();
$('join').onclick = () => send({ type: 'JOIN_LOBBY' });
$('leave').onclick = () => send({ type: 'LEAVE_LOBBY' });
$('accept').onclick = () => { $('accept').disabled = true; $('matchHint').textContent = 'Accepted — waiting for your opponent…'; send({ type: 'ACCEPT_MATCH', matchId: currentMatch }); };
$('decline').onclick = () => send({ type: 'DECLINE_MATCH', matchId: currentMatch });
$('playerId').addEventListener('keydown', e => { if (e.key === 'Enter') $('connect').click(); });
$('playerId').value = localStorage.getItem('playerId') || '';
setInterval(tick, 200);
render();
</script>
</body>
</html>
